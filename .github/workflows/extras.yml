name: Stock Extras (feed/company 일 1회)
# 종목조회 심화 데이터(company.json 6일 가드 · feed.json 20h 가드) 갱신.
# ⚠원래 refresh.yml(30분) 안에 있었는데 feed 재생성이 **~52분**이라, 걸리는 날은 그 런이
#   80분짜리가 되어 뒤 런들이 연쇄 취소됐다(2026-08-07 실측, 성공 런 로그로 확인).
#   하루 1회 작업은 하루 1회 워크플로에 — 커밋하면 deploy.yml(push 트리거)이 알아서 게시한다.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST (07:40 노트북 daily·08:20 financials보다 앞)

permissions:
  contents: write

concurrency:
  group: extras-data
  cancel-in-progress: false

jobs:
  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install deps
        run: pip install -r engine/requirements.txt

      - name: Seed engine data (가드 스탬프·기존값 보존 병합의 기준)
        run: |
          mkdir -p engine/app/data
          cp -f data/*.json engine/app/data/ 2>/dev/null || true
          mkdir -p engine/app/data/disclosures
          cp -f data/disclosures/*.json engine/app/data/disclosures/ 2>/dev/null || true

      - name: Run stock_extras
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          cd engine
          python analysis/stock_extras.py

      - name: Copy back + commit
        run: |
          for f in company feed; do
            [ -f "engine/app/data/$f.json" ] && cp -f "engine/app/data/$f.json" "data/$f.json" || true
          done
          git config user.name "chart-cloud-bot"
          git config user.email "actions@github.com"
          git add data/company.json data/feed.json || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "extras(cloud) $(date '+%Y-%m-%d %H:%M') KST"
            git checkout -- . || true
            # refresh.yml과 같은 이유: 30분 refresh 커밋과 경합하므로 -X theirs(이 런 승) + 재시도
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs origin main && break
              git rebase --abort || true
              sleep $((i*5))
            done
            git push origin HEAD:main || { git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main; } || echo "push 실패(무시)"
          fi
